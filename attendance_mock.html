<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>入口サイネージ｜勤怠デジタル化 MOCK</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="config.js"></script>
<style>
  :root { --line:#334155; --text:#e5e7eb; --muted:#94a3b8; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         background:linear-gradient(180deg,#0b1220,#111827); color:var(--text);
         display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; padding:24px; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .clock { font-size:clamp(56px,11vw,132px); font-weight:700; letter-spacing:2px; line-height:1; }
  .date { font-size:clamp(16px,2.6vw,26px); color:var(--muted); margin-top:10px; }
  .qrbox { background:#fff; border-radius:20px; padding:18px; box-shadow:0 18px 50px rgba(0,0,0,.45); }
  #qr { display:block; width:min(46vh,380px); height:min(46vh,380px); image-rendering:pixelated; }
  .lead { font-size:clamp(15px,2.2vw,22px); color:var(--muted); text-align:center; }
  .foot { position:fixed; bottom:14px; left:0; right:0; display:flex; justify-content:center; gap:18px;
          font-size:12px; color:#64748b; }
  .foot a { color:#64748b; }
  .warntext { color:#fbbf24; }
</style>
</head>
<body>
  <div style="text-align:center">
    <div id="clock" class="clock mono">--:--:--</div>
    <div id="today" class="date"></div>
  </div>

  <div class="qrbox"><canvas id="qr" aria-label="出社用QRコード"></canvas></div>

  <div class="lead">スマホのカメラでQRを読み取り、Passkeyで出社打刻</div>

  <div class="foot">
    <span id="qrStatus" class="mono"></span>
    <a href="monitor.html">打刻モニターを開く →</a>
  </div>

<script>
const API_BASE = window.ATTENDANCE_API_BASE;
const OFFICE = "OFFICE-A";
// スマホで開く打刻ページ（Passkeyを登録したドメインと同じである必要がある）
const ATTENDANCE_URL = "https://yamamotoryutasjc.github.io/attendance-webauthn-demo/index.html";

let currentQr = { token:null, expiresAt:0 };
let refreshing = false;

async function api(path, body){
  const res = await fetch(API_BASE + path, body === undefined ? {} : {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(data.error || ("サーバーエラー (" + res.status + ")"));
  return data;
}

function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

// QRには必ずURLを埋め込む（文字列だけだとスマホのカメラが「利用できるデータなし」と判定する）
function qrPayload(token){
  const url = new URL(ATTENDANCE_URL);
  url.searchParams.set("qr", token);
  return url.toString();
}

async function refreshQr(){
  if(refreshing) return;
  refreshing = true;
  try{
    const r = await api("/api/qr", { office: OFFICE });
    // サーバーとPCの時計のずれを補正して、表示上の有効期限を合わせる
    currentQr = { token: r.token, expiresAt: Date.now() + (r.expiresAt - r.serverTime) };
    drawQr(qrPayload(r.token));
    document.getElementById("qrStatus").textContent =
      r.office + " / " + new Date(currentQr.expiresAt).toLocaleTimeString("ja-JP") + " まで有効";
  }catch(e){
    currentQr.expiresAt = Date.now() + 5000; // 5秒後に再試行
    document.getElementById("qrStatus").innerHTML =
      '<span class="warntext">QRを発行できません：</span> ' + escapeHtml(e.message);
  }finally{
    refreshing = false;
  }
}

function drawQr(text){
  const canvas = document.getElementById("qr");
  const ctx = canvas.getContext("2d");
  if(typeof qrcode !== "function"){
    canvas.width = canvas.height = 220;
    ctx.fillStyle = "#fff"; ctx.fillRect(0,0,220,220);
    ctx.fillStyle = "#991b1b"; ctx.font = "13px sans-serif";
    ctx.fillText("QRライブラリを読み込めません", 16, 110);
    return;
  }
  const qr = qrcode(0, "M"); // 型番は自動、誤り訂正レベルM
  qr.addData(text);
  qr.make();
  const count = qr.getModuleCount();
  const quiet = 4; // QR仕様のクワイエットゾーン（4セル）
  const cell = Math.max(2, Math.floor(520 / (count + quiet * 2)));
  const size = (count + quiet * 2) * cell;
  canvas.width = canvas.height = size;
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = "#000";
  for(let r=0;r<count;r++){
    for(let c=0;c<count;c++){
      if(qr.isDark(r,c)) ctx.fillRect((c + quiet) * cell, (r + quiet) * cell, cell, cell);
    }
  }
}

function tick(){
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleTimeString("ja-JP");
  document.getElementById("today").textContent =
    now.toLocaleDateString("ja-JP", { year:"numeric", month:"long", day:"numeric", weekday:"long" });
  if(Date.now() >= currentQr.expiresAt) refreshQr();
}

setInterval(tick, 1000);
tick();
</script>
</body>
</html>
